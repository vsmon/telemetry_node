name: Build and Push Docker Image

# 1. O Gatilho: Roda sempre que houver um push direto na branch main
on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # (Não precisa mais daquela linha "if: github.event.pull_request.merged == true")

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        # --- PASSO NOVO 1: Configura o QEMU para emular outras arquiteturas ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # --- PASSO NOVO 2: Configura o Buildx do Docker ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Service Account Key File
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > serviceAccountKey.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:latest